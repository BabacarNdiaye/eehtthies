<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne — EEHT de Thiès</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #50022b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            text-align: center;
            padding: 24px;
        }
        .card { max-width: 380px; }
        img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; }
        h1 { font-size: 1.25rem; margin: 0 0 10px; }
        p { color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
        button {
            background: #8bc93f;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon-192.png" alt="EEHT de Thiès">
        <h1>Vous êtes hors ligne</h1>
        <p>Impossible de joindre le serveur pour le moment. Vérifiez votre connexion internet puis réessayez.</p>
        <button onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
